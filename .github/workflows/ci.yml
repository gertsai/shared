name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 for JavaScript actions so they don't emit the Node 20
# deprecation warning. GitHub forces Node 24 by default starting 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changesets-status:
    name: Changesets status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test publication approval boundaries
        run: pnpm exec vitest run --dir .github/scripts

      - name: Fetch main for pull request comparison
        run: git fetch origin main

      - name: Check ordinary pull request changesets
        if: >-
          github.event_name == 'pull_request' &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'changeset-release/main')
        run: pnpm changeset status --since=origin/main

      - name: Establish baseline for release PR and dispatch status
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref == 'changeset-release/main')
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch --no-track main HEAD

      - name: Check release pull request or dispatched workflow changesets
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref == 'changeset-release/main')
        run: pnpm changeset status

  build-test:
    name: Build / Test / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  publint:
    name: Publint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run publint

  attw:
    name: Are The Types Wrong
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run attw

  depcruise:
    name: Dependency Cruiser (m9s-example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run depcruise
