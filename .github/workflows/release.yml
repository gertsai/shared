name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-release-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect pending version intent without querying a registry
        id: intent
        uses: actions/github-script@v7
        env:
          VERSION_STATUS_PATH: ${{ runner.temp }}/version-status.json
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            execFileSync('pnpm', ['changeset', 'status', '--output', process.env.VERSION_STATUS_PATH], { stdio: 'inherit' });
            const status = JSON.parse(fs.readFileSync(process.env.VERSION_STATUS_PATH, 'utf8'));
            if (!Array.isArray(status.changesets)) throw new Error('Malformed version-intent status.');
            return status.changesets.length > 0;

      - name: Create or update the release pull request
        if: steps.intent.outputs.result == 'true'
        id: changesets
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version:packages
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'

      - name: Dispatch CI for the generated release pull request
        if: steps.changesets.outputs.pr-number != ''
        uses: actions/github-script@v7
        env:
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        with:
          script: |
            const pullNumber = Number(process.env.RELEASE_PR_NUMBER);
            if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('Changesets returned an invalid pull request number.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (
              pull.base?.repo?.full_name !== `${owner}/${repo}` ||
              pull.base?.ref !== 'main' ||
              pull.head?.repo?.full_name !== `${owner}/${repo}` ||
              pull.head?.ref !== 'changeset-release/main' ||
              !pull.head?.sha
            ) {
              core.setFailed('Changesets PR repository, base, or branch did not match the expected release PR.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci.yml',
              ref: pull.head.ref,
            });
