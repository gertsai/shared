name: Publish

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to publish
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to authorize this publication
        required: true
        type: string

concurrency:
  group: changesets-release-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gertsai'

      - run: pnpm install --frozen-lockfile

      - name: Establish exact checked-out main baseline
        run: git show-ref --verify --quiet refs/heads/main || git branch --no-track main HEAD

      - name: Generate Changesets status data
        env:
          CHANGESET_STATUS_PATH: ${{ runner.temp }}/changesets-status.json
        run: pnpm changeset status --output "$CHANGESET_STATUS_PATH"

      - name: Validate publication preflight
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          CHANGESET_STATUS_PATH: ${{ runner.temp }}/changesets-status.json
        with:
          script: |
            const validate = require('./.github/scripts/release-preflight.cjs');
            await validate({ github, context, core, statusPath: process.env.CHANGESET_STATUS_PATH });

      - run: pnpm build

      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm run lint

      - run: pnpm run publint

      - run: pnpm run attw

      - run: pnpm run depcruise

      - name: Re-check publication preflight immediately before publishing
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          CHANGESET_STATUS_PATH: ${{ runner.temp }}/changesets-status.json
        with:
          script: |
            const validate = require('./.github/scripts/release-preflight.cjs');
            await validate({ github, context, core, statusPath: process.env.CHANGESET_STATUS_PATH });

      - name: Publish packages and create GitHub releases
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
